services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog.api:
    container_name: catalog.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DatabaseSettings__ConnectionString=mongodb://catalogdb:27017
      - DatabaseSettings__DatabaseName=CatalogDb
      - DatabaseSettings__ProductsCollection=Products
      - DatabaseSettings__BrandsCollection=Brands
      - DatabaseSettings__TypesCollection=Types
    depends_on:
      catalogdb:
        condition: service_healthy
    ports:
      - "9000:8080" # فقط پورت 9000 را نگه داشتیم

  basketdb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"

  basket.api:
    container_name: basket.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Redis=basketdb:6379
      - ASPNETCORE_URLS=http://*:8080 
      - "GrpcSettings__DiscountUrl=http://discount.api:8080" 
    ports:
      - "9001:8080" # سبد خرید روی پورت 9001
    depends_on:
      - basketdb


  discountdb:
    container_name: discountdb
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Kami@123
      POSTGRES_DB: DiscountDb
    ports:
      - "5432:5432"
    volumes:
      - discount_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DiscountDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Kami@123
    ports:
      - "5050:80"
    depends_on:
      discountdb:
        condition: service_healthy
    volumes:
    - pgadmin_data:/root/.pgadmin


  discount.api:
    container_name: discount.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - DatabaseSettings__ConnectionString=Server=discountdb;Port=5432;Database=DiscountDb;User Id=admin;Password=Kami@123;
    ports:
      - "9002:8080"
    depends_on:
      discountdb:
        condition: service_healthy

volumes:
  discount_data:
